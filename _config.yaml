# site properties and page defaults
title: Reid Brennan
subtitle: Physiological and evolutionary genomics of marine resilience
description: Reid Brennan, Research Biologist at NOAA's Southeast Fisheries Science Center, studying the physiological and evolutionary genomics of marine resilience.
header: images/background.jpg
footer: 

# site social media and other links
links:
  email: reid.brennan@gmail.com
  google-scholar: 4Ykg3a0AAAAJ
  github: rsbrennan
  twitter: reidbrennan

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
